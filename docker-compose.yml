services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: simple-workflow-backend
    environment:
      SW_CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-3000}"
      # Web search backend: auto picks Tavily, Brave or SearXNG when configured,
      # otherwise DuckDuckGo (keyless, can be rate-limited). Set these in .env.
      SW_MODEL_RETRIES: "${SW_MODEL_RETRIES:-3}"
      SW_MODEL_TIMEOUT_SECONDS: "${SW_MODEL_TIMEOUT_SECONDS:-300}"
      SW_SEARCH_PROVIDER: "${SW_SEARCH_PROVIDER:-auto}"
      SW_TAVILY_API_KEY: "${SW_TAVILY_API_KEY:-}"
      SW_BRAVE_API_KEY: "${SW_BRAVE_API_KEY:-}"
      SW_SEARXNG_URL: "${SW_SEARXNG_URL:-}"
      SW_DDGS_BACKENDS: "${SW_DDGS_BACKENDS:-duckduckgo,wikipedia}"
      SW_OPENALEX_API_KEY: "${SW_OPENALEX_API_KEY:-}"
    volumes:
      # Sessions, saved turns, the knowledge base and approved report folders.
      - sw-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8000}"
    container_name: simple-workflow-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  sw-data:
