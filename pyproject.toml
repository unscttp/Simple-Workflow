# Tooling for the Python backend. The application itself is configured with
# environment variables; see README.md.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "frontend", "easter-eggs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "B904",   # API handlers translate exceptions into HTTP errors on purpose
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["workflow_core", "workflow_logging", "workflow_memory_store"]
